name: Reproduce offline experiment
on: [push, pull_request]
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 governance_comparative/experiment.py --out reproduction/main
      - run: python3 decision_rights_validation/run.py --out reproduction/v2
      - run: python3 verify.py reproduction/main/summary.json reproduction/v2/summary.json
